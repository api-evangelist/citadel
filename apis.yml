description: Citadel (also branded Citadel Defense / Drone Citadel) is a counter-unmanned-aircraft-system
  (C-UAS) company founded in 2016 that built an automated, modular drone-defense solution using proprietary
  machine-learning algorithms to detect, classify, and defeat unauthorized drones. It raised a Lightspeed
  Venture Partners Series A in 2017 and was subsequently acquired by BlueHalo. The company operates no
  public developer portal, API, SDK, or documentation surface, and its standalone domains (citadeldefense.com,
  dronecitadel.com) are now parked or no longer resolve.
